{% extends 'base.html' %}
{% block title %}Add Subject{% endblock %}
{% block content %}
<div class="page-header"><div class="page-header-left"><h1 class="page-title">Add Subject</h1></div></div>
<div class="row justify-content-center"><div class="col-lg-6">
<form method="POST">
  <div class="card">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-8"><label class="form-label">Subject Name *</label><input type="text" name="name" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Code *</label><input type="text" name="code" class="form-control" required placeholder="e.g. MATH101"></div>
        <div class="col-md-6"><label class="form-label">Class</label><select name="class_id" class="form-select"><option value="">Select</option>{% for c in classes %}<option value="{{ c.id }}">{{ c.full_name }}</option>{% endfor %}</select></div>
        <div class="col-md-6"><label class="form-label">Teacher</label><select name="teacher_id" class="form-select"><option value="">Select</option>{% for t in teachers %}<option value="{{ t.id }}">{{ t.full_name }}</option>{% endfor %}</select></div>
        <div class="col-md-6"><label class="form-label">Department</label><select name="department_id" class="form-select"><option value="">Select</option>{% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></div>
        <div class="col-md-6"><label class="form-label">Credit Hours</label><input type="number" name="credit_hours" class="form-control" value="3"></div>
        <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
        <div class="col-12"><div class="form-check"><input type="checkbox" name="is_elective" id="elective" class="form-check-input"><label class="form-check-label" for="elective">Elective subject</label></div></div>
      </div>
    </div>
    <div class="card-footer d-flex gap-2"><button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Add Subject</button><a href="{{ url_for('admin.subjects') }}" class="btn btn-light">Cancel</a></div>
  </div>
</form>
</div></div>
{% endblock %}
