{% extends 'base.html' %}
{% block title %}Issue Certificate{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-header-left">
    <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="{{ url_for('admin.certificates') }}">Certificates</a></li><li class="breadcrumb-item active">Issue</li></ol></nav>
    <h1 class="page-title">Issue Certificate</h1>
  </div>
</div>
<div class="row justify-content-center">
<div class="col-lg-7">
<form method="POST">
  <div class="card">
    <div class="card-header"><h5 class="card-title"><i class="fas fa-certificate me-2 text-warning"></i>Certificate Details</h5></div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Student *</label>
          <select name="student_id" class="form-select" required>
            <option value="">Select student</option>
            {% for s in students %}<option value="{{ s.id }}" {{ 'selected' if request.args.get('student_id')|int == s.id }}>{{ s.full_name }} ({{ s.student_id }})</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Certificate Type *</label>
          <select name="certificate_type" class="form-select" required>
            {% for t in ['completion','merit','sports','participation','conduct','transfer','achievement'] %}
            <option value="{{ t }}">{{ t | title }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Issue Date</label>
          <input type="date" name="issue_date" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label">Certificate Title *</label>
          <input type="text" name="title" class="form-control" required placeholder="e.g. Certificate of Completion — Grade 10">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="3" placeholder="Certificate body text or achievement description…"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Academic Year</label>
          <input type="text" name="academic_year" class="form-control" placeholder="2024-2025">
        </div>
      </div>
    </div>
    <div class="card-footer d-flex gap-2">
      <button type="submit" class="btn btn-primary"><i class="fas fa-stamp me-2"></i>Issue Certificate</button>
      <a href="{{ url_for('admin.certificates') }}" class="btn btn-light">Cancel</a>
    </div>
  </div>
</form>
</div>
</div>
{% endblock %}
