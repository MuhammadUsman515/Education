<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1e293b, #4f46e5); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px; }
    .code { font-size: 120px; font-weight: 800; color: rgba(255,255,255,.15); line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { color: rgba(255,255,255,.7); margin-bottom: 32px; }
    a { display: inline-block; background: white; color: #4f46e5; padding: 12px 28px; border-radius: 10px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">← Back to Home</a>
  </div>
</body>
</html>
