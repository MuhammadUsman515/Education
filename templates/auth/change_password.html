{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="page-header">
      <div class="page-header-left">
        <h1 class="page-title">Change Password</h1>
        <p class="page-subtitle">Update your account password</p>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <form method="POST" action="{{ url_for('auth.change_password') }}">
          <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input type="password" name="current_password" class="form-control" required placeholder="Enter current password">
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="new_password" class="form-control" required minlength="6" placeholder="At least 6 characters">
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-control" required placeholder="Repeat new password">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill"><i class="fas fa-save me-2"></i>Update Password</button>
            <a href="{{ url_for('auth.profile') }}" class="btn btn-light">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
