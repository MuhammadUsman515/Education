{% extends 'base.html' %}
{% block title %}Add Department{% endblock %}
{% block content %}
<div class="page-header"><div class="page-header-left"><h1 class="page-title">Add Department</h1></div></div>
<div class="row justify-content-center"><div class="col-lg-5">
<form method="POST">
  <div class="card">
    <div class="card-body">
      <div class="mb-3"><label class="form-label">Department Name *</label><input type="text" name="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Code *</label><input type="text" name="code" class="form-control" required placeholder="e.g. DEPT-MATH"></div>
      <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
    </div>
    <div class="card-footer d-flex gap-2"><button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Create</button><a href="{{ url_for('admin.departments') }}" class="btn btn-light">Cancel</a></div>
  </div>
</form>
</div></div>
{% endblock %}
